
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test | Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .home-page {
            max-width: 900px;
            margin: 70px auto;
            padding: 30px 20px;
            text-align: center;
        }

        .home-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .home-page h1 {
            font-size: clamp(36px, 6vw, 60px);
            margin-bottom: 18px;
        }

        .home-page h1 span {
            color: #8b7cff;
        }

        .home-description {
            max-width: 600px;
            margin: 0 auto 35px;
            line-height: 1.8;
            opacity: 0.8;
        }

        .home-card {
            max-width: 600px;
            margin: 0 auto;
            padding: 28px;
            border: 1px solid #393354;
            border-radius: 20px;
            background: #17152b;
        }

        .home-card h2 {
            margin-top: 0;
        }

        .home-page .time-modes {
            margin: 25px 0;
        }

        .start-button {
            display: inline-block;
            width: 100%;
            max-width: 300px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #6d5dfc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-button:hover {
            background: #8578ff;
            transform: translateY(-2px);
        }

        .home-footer {
            margin-top: 35px;
            font-size: 13px;
            opacity: 0.65;
        }
    </style>
</head>
<body>

    <main class="home-page">
        <div class="home-icon">⌨️</div>

        <h1>Test Your <span>Typing Speed</span></h1>

        <p class="home-description">
            Discover how fast you can type! Challenge yourself,
            improve your accuracy, and track your progress with
            our simple and interactive typing test.
        </p>

        <section class="home-card">
            <h2>Ready to take the test?</h2>
            <p>Choose your test duration</p>

            <div class="time-modes">
                <button class="time-btn" data-time="15">15 sec</button>
                <button class="time-btn active" data-time="30">30 sec</button>
                <button class="time-btn" data-time="60">60 sec</button>
                <button class="time-btn" data-time="120">120 sec</button>
            </div>

            <button class="start-button" id="start-test">
                Start Test →
            </button>
        </section>

        <p class="home-footer">
            Practise daily. Improve steadily. Type confidently.
        </p>
    </main>

    <script>
        let selectedDuration = 30;

        const timeButtons = document.querySelectorAll(".time-btn");

        timeButtons.forEach(button => {
            button.addEventListener("click", () => {
                selectedDuration = Number(button.dataset.time);

                timeButtons.forEach(item =>
                    item.classList.remove("active")
                );

                button.classList.add("active");
            });
        });

        document.getElementById("start-test").addEventListener("click", () => {
            window.location.href = "test.html?duration=" + selectedDuration;
        });
    </script>

</body>
</html>
